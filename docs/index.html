<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI training &amp; data annotation jobs: what they pay</title>
<meta name="description" content="Open AI-training and data-annotation jobs from contributor platforms, data companies and AI labs, with their hourly pay, who can apply and what they ask for.">
<meta property="og:title" content="AI training & data annotation jobs: what they pay">
<meta property="og:description" content="Hourly pay of open AI-training and data-annotation jobs, by site, field, kind of task, language, degree, experience and more.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><circle cx='9' cy='20' r='3' fill='white'/><circle cx='16' cy='12' r='3' fill='white'/><circle cx='23' cy='16' r='3' fill='white'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <p class="eyebrow">AI training &amp; data annotation work</p>
    <h1>What the jobs pay</h1>
    <p class="lede" id="lede">Open jobs from contributor platforms, data companies' own boards, AI labs and big tech.</p>
  </div>
</header>

<div class="filterbar" id="filterbar">
  <div class="wrap">
    <!-- three zones: which pay (pick one), search (free text), filters (narrow down, combinable) -->
    <div class="bar-row bar-main">
      <div class="zone zone-pay" id="zone-pay"></div>
      <span class="vdiv" aria-hidden="true"></span>
      <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
        <input id="q" type="search" placeholder="Search titles, companies, places" autocomplete="off" aria-label="Search"></label>
    </div>
    <div class="bar-row bar-filters">
      <div class="filters" id="filters" role="group" aria-label="Filters"></div>
    </div>
  </div>
</div>

<main class="wrap">
  <section class="card" id="chart-card">
    <div class="card-head">
      <div>
        <h2 id="chart-title">Hourly pay</h2>
        <p class="sub" id="chart-sub"></p>
      </div>
      <div class="controls">
        <label class="ctl"><span>Group by</span><select id="x"></select></label>
        <label class="ctl"><span id="color-label">Color dots by</span><select id="color"></select></label>
        <label class="ctl"><span>Order</span><select id="sort">
          <option value="auto">Automatic</option>
          <option value="median">Highest median first</option>
          <option value="count">Most jobs first</option>
          <option value="natural">List order</option>
        </select></label>
        <div class="ctl"><span>Pay axis</span>
          <div class="seg" id="scale" role="group" aria-label="Pay axis">
            <button type="button" data-v="log">Log</button><button type="button" data-v="linear">Linear</button>
          </div>
        </div>
      </div>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <div class="chart-scroll" id="chart-scroll"><svg id="chart" role="img" aria-labelledby="chart-title"></svg></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="legend" id="legend"></div>
    <p class="note" id="chart-note"></p>
  </section>

  <section class="card" id="table-card">
    <div class="card-head">
      <div>
        <h2 id="table-title">Jobs</h2>
        <p class="sub">Click a row for the details behind each number. Click a column name to sort.</p>
      </div>
      <div class="controls"><button type="button" class="btn" id="csv">Download these jobs (CSV)</button></div>
    </div>
    <div class="table-scroll"><table id="table"><thead></thead><tbody></tbody></table></div>
    <div class="more" id="more"></div>
  </section>

  <section class="card about" id="about">
    <h2>Sites we checked that are not in the chart</h2>
    <div id="unlisted"></div>
    <p class="foot" id="foot"></p>
  </section>
</main>

<div class="pop" id="pop" hidden></div>

<script src="vendor/d3-7.9.0.min.js"></script>
<script src="app.js"></script>
</body>
</html>
